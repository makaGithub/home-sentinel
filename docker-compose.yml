# home-sentinel (CPU): RTSP/аудио + красивые логи на 172.16.78.111
# GPU: hs-gpu-helper в k8s (chart/) → GPU_HELPER_URL

services:
  home-sentinel:
    build:
      context: ./code
      dockerfile: Dockerfile.client
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-harbor.iportal.ru/hub.docker.com/library/python:3.10-slim-bookworm}
        PKG_CACHE_DEBIAN: ${PKG_CACHE_DEBIAN:-http://pkg-cache-debian.iportal.ru}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://devpi.iportal.ru/root/pypi/+simple/}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-devpi.iportal.ru}
    container_name: home-sentinel
    restart: unless-stopped
    env_file:
      - .env
    environment:
      GPU_HELPER_URL: ${GPU_HELPER_URL:-http://127.0.0.1:8080}
      MQTT_BROKER: ${MQTT_BROKER:-}
      PRESENCE_TRACKING_ENABLED: ${PRESENCE_TRACKING_ENABLED:-false}
      # Перебивает .env: без GPU на .111 CDI иначе падает на runtime.nvidia.com/gpu=all
      NVIDIA_VISIBLE_DEVICES: void
      NVIDIA_DRIVER_CAPABILITIES: ""
    volumes:
      - ./code:/app/code
      - ./data/cache:/app/cache
      - ./data/screenshots:/app/data/screenshots
    working_dir: /app/code
    command: ["python3", "main.py"]
    networks:
      - home-sentinel-net

  screenshots-web:
    image: harbor.iportal.ru/hub.docker.com/library/nginx:alpine
    container_name: screenshots-web
    restart: unless-stopped
    ports:
      # :80 на хосте занят pauto-nginx; галерея — :8080
      - "${SCREENSHOTS_WEB_PORT:-8080}:80"
    volumes:
      - ./data/screenshots:/screenshots:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/index.html:/usr/share/nginx/html/index.html:ro
    networks:
      - home-sentinel-net

networks:
  home-sentinel-net:
    driver: bridge
